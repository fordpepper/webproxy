<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link</title>
<style>body{font:16px system-ui,sans-serif;max-width:480px;margin:18vh auto;padding:0 16px}input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;margin:6px 0}button{padding:10px 18px;font-size:16px}</style>
<h3 id="s">Looking for the host ...</h3>
<div id="k" style="display:none"><input id="ki" type="password" placeholder="Access key"><button id="kb">Go</button></div>
<script>
var O="fordpepper",R="webproxy",tries=0,key=location.hash.slice(1);
try{if(key)sessionStorage.setItem("wpk",key);else key=sessionStorage.getItem("wpk")||""}catch(e){}
if(location.hash)history.replaceState(null,"",location.pathname);
function say(t){document.getElementById("s").textContent=t}
async function info(){var r=await fetch("https://api.github.com/repos/"+O+"/"+R+"/contents/url.json",{headers:{Accept:"application/vnd.github.raw+json"},cache:"no-store"});if(!r.ok)throw new Error("x");return r.json()}
async function alive(u){try{var r=await fetch(u+"/_/ping",{cache:"no-store"});return (await r.text())==="ok"}catch(e){return false}}
async function tick(){
 try{var j=await info();
  if(!key&&!j.open){say("Enter the access key");document.getElementById("k").style.display="block";return}
  if(j.url&&await alive(j.url)){say("Connecting ...");location.replace(j.url+"/?k="+encodeURIComponent(key));return}
  say("The host is offline or restarting. Retrying ...")
 }catch(e){say("Cannot read the link info. Retrying ...")}
 tries++;setTimeout(tick,Math.min(60000,8000+tries*4000))}
document.getElementById("kb").onclick=function(){key=document.getElementById("ki").value.trim();try{sessionStorage.setItem("wpk",key)}catch(e){}document.getElementById("k").style.display="none";tries=0;tick()};
tick();
</script>
